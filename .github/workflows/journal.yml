name: Verify Firebase journal

on:
  push:
    branches: [feat/firebase-journal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax and original calculator regression
        run: |
          for file in dist/*.js; do node --check "$file"; done
          node --test tests/*.test.cjs
      - name: Install test-only tools
        run: |
          npm install --prefix tests/firebase --no-package-lock --ignore-scripts
          npm ls --prefix tests/firebase --depth=0
      - name: Validate Firestore rules with isolated demo emulator
        run: tests/firebase/node_modules/.bin/firebase emulators:exec --project demo-okx-risk-dashboard --only firestore "node --test tests/firebase/rules.test.mjs"
      - name: Install Chromium
        run: tests/firebase/node_modules/.bin/playwright install --with-deps chromium
      - name: Desktop, tablet and phone journal interactions
        run: tests/firebase/node_modules/.bin/playwright test --config tests/firebase/playwright.config.cjs
      - name: Upload verification screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-verification
          path: |
            test-results
            playwright-report
            firestore-debug.log
